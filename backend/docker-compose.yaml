services:

  firefusion-api: # api
    profiles: ["default", "firefusion"]
    image: firefusion/firefusion-api
    build:
      context: .
      dockerfile: firefusion-api/Dockerfile
    ports:
      - 8080:8080
    depends_on:
      broker:
        condition: service_healthy
      cache:
        condition: service_healthy
      # FireFusion API now depends on aggregator-api because it may retrieve
      # prepared Data Engineering records through the Backend service layer.
      aggregator-api:
        condition: service_started
    environment:
      BROKER_URL: amqp://guest:guest@broker:5672
      CACHE_URL: redis://cache:6379
      DB_URL: postgresql://postgres:postgres@relational-db:5432/postgres
      PYTHONUNBUFFERED: 1
      # Internal REST URL for Backend -> aggregator-api communication.
      AGGREGATOR_URL: http://aggregator-api:8080

      # URL for Backend -> AI Modelling FastAPI communication.
      # Defaults to a model API running on the host machine during development,
      # but can be overridden through the AI_MODELLING_URL environment variable.
      AI_MODELLING_URL: ${AI_MODELLING_URL:-http://host.docker.internal:8090}

      # OpenTelemetry tracing. Off by default; see docs/distributed-tracing.md.
      OTEL_TRACES_ENABLED: ${OTEL_TRACES_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-tempo:4317}
      OTEL_SERVICE_NAME: firefusion-api

  model-api: # api
    profiles: ["default"]
    image: firefusion/model-api
    build:
      context: .
      dockerfile: model-api/Dockerfile
    ports:
      - 8081:8080
    depends_on:
      broker:
        condition: service_healthy
    environment:
      BROKER_URL: amqp://guest:guest@broker:5672
      API_KEY: ${API_KEY:-local-development-key}
      PYTHONUNBUFFERED: 1
      OTEL_TRACES_ENABLED: ${OTEL_TRACES_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-tempo:4317}
      OTEL_SERVICE_NAME: model-api

  aggregator-api: # api
    profiles: ["default", "aggregator"]
    image: firefusion/aggregator-api
    build:
      context: .
      dockerfile: aggregator-api/Dockerfile
    ports:
      - 8082:8080
    depends_on:
      relational-db:
        condition: service_healthy
      broker:
        condition: service_healthy
    environment:
      RELATIONAL_DB_URL: postgresql://postgres:postgres@relational-db:5432/postgres
      BROKER_URL: amqp://guest:guest@broker:5672
      API_KEY: ${API_KEY:-local-development-key}
      PYTHONUNBUFFERED: 1
      OTEL_TRACES_ENABLED: ${OTEL_TRACES_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-tempo:4317}
      OTEL_SERVICE_NAME: aggregator-api

  relational-db: # relational database
    profiles: ["default", "aggregator"]
    image: postgres:18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./utilities/aggregator-init.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./utilities/seed-aggregator.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - ./utilities/misinformation/misinformation-init.sql:/docker-entrypoint-initdb.d/03-schema.sql
      - ./utilities/misinformation/misinformation-seed.sql:/docker-entrypoint-initdb.d/04-seed.sql
      - ./utilities/v2/aggregator-init.sql:/docker-entrypoint-initdb.d/05-schema.sql
      - ./utilities/v2/seed-aggregator.sql:/docker-entrypoint-initdb.d/06-seed.sql
      - ./utilities/firefusion/forecast-history-init.sql:/docker-entrypoint-initdb.d/07-schema.sql
    ports:
      - "5432:5432"

  broker: # message broker
    profiles: ["default", "aggregator", "firefusion"]
    image: rabbitmq:4.3-rc-management # image has mangement ui
    ports:
      - 5672:5672
      - 15672:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 3s
      retries: 5

  cache:
    profiles: ["default", "firefusion"]
    image: redis:8.6.2
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Local tracing backend for development and demos. The deployed platform
  # runs the equivalent in infrastructure/observability/tempo/; this is a
  # standalone instance so OTEL_TRACES_ENABLED=true works without a cluster.
  tempo:
    profiles: ["default", "firefusion", "aggregator"]
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./utilities/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports:
      - "3200:3200"   # HTTP API/query, used by Grafana and to fetch a trace directly
      - "4317:4317"   # OTLP gRPC, where the services export spans to
      - "4318:4318"   # OTLP HTTP
    # No healthcheck/depends_on wiring: nothing else needs Tempo to be up.
    # Tracing is best-effort by design (see shared/tracing.py) - the rest of
    # the stack must work identically whether or not this container exists.
