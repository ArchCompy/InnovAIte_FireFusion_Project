apiVersion: v1
kind: Secret
metadata:
  name: firefusion-runtime-secrets
  namespace: firefusion
  labels:
    app.kubernetes.io/name: firefusion-runtime-secrets
    app.kubernetes.io/part-of: firefusion-platform

type: Opaque

stringData:
  # Messaging infrastructure
  BROKER_URL: "REPLACE_WITH_BROKER_CONNECTION_STRING"

  # Cache infrastructure
  CACHE_URL: "REPLACE_WITH_CACHE_CONNECTION_STRING"

  # FireFusion API database
  DB_URL: "REPLACE_WITH_DATABASE_CONNECTION_STRING"

  # Aggregator API database
  RELATIONAL_DB_URL: "REPLACE_WITH_DATABASE_CONNECTION_STRING"

  # Aggregator API authentication
  API_KEY: "REPLACE_WITH_API_KEY"

  # Model API authentication
  VALID_API_KEY: "REPLACE_WITH_MODEL_API_KEY"
