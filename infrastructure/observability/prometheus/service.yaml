apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: firefusion-platform
spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: prometheus

  ports:
    - name: http
      protocol: TCP
      port: 9090
      targetPort: http
