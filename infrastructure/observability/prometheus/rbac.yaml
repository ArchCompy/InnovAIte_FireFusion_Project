apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: firefusion-prometheus
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - services
      - endpoints
      - pods
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: firefusion-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: firefusion-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
