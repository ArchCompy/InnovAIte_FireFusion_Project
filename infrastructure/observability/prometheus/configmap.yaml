apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: firefusion-platform
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules/*.yaml

    scrape_configs:
      - job_name: firefusion-backend

        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - firefusion

        relabel_configs:
          - source_labels:
              - __meta_kubernetes_service_name
            regex: firefusion-api|model-api|aggregator-api
            action: keep

          - source_labels:
              - __meta_kubernetes_endpoint_port_name
            regex: http
            action: keep

          - source_labels:
              - __meta_kubernetes_service_name
            target_label: service

          - source_labels:
              - __meta_kubernetes_pod_name
            target_label: pod

          - source_labels:
              - __meta_kubernetes_namespace
            target_label: namespace

          - target_label: environment
            replacement: firefusion

        metrics_path: /metrics
