apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: monitoring
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: firefusion-platform
spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: loki

  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
        app.kubernetes.io/part-of: firefusion-platform

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: loki
          image: grafana/loki:3.7.0

          args:
            - -config.file=/etc/loki/loki.yaml

          ports:
            - name: http
              containerPort: 3100

            - name: grpc
              containerPort: 9096

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20

          volumeMounts:
            - name: loki-config
              mountPath: /etc/loki
              readOnly: true

            - name: loki-data
              mountPath: /loki

            - name: loki-tmp
              mountPath: /tmp

      volumes:
        - name: loki-config
          configMap:
            name: loki-config

        - name: loki-data
          emptyDir: {}

        - name: loki-tmp
          emptyDir: {}
