apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: monitoring
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: firefusion-platform
spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: loki

  ports:
    - name: http
      protocol: TCP
      port: 3100
      targetPort: http

    - name: grpc
      protocol: TCP
      port: 9096
      targetPort: grpc
