apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-firefusion
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: firefusion-platform
data:
  firefusion-backend.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": false,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "type": "stat",
          "title": "Backend Request Rate",
          "id": 1,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total[5m]))",
              "legendFormat": "requests/sec",
              "refId": "A"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 0
          }
        },
        {
          "type": "timeseries",
          "title": "Request Rate by Service",
          "id": 2,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum by (service) (rate(http_requests_total[5m]))",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 16,
            "x": 8,
            "y": 0
          }
        },
        {
          "type": "timeseries",
          "title": "HTTP Response Status",
          "id": 3,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum by (service, status) (rate(http_requests_total[5m]))",
              "legendFormat": "{{service}} - {{status}}",
              "refId": "A"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          }
        },
        {
          "type": "timeseries",
          "title": "Request Duration",
          "id": 4,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "rate(http_request_duration_seconds_sum[5m]) / rate(http_request_duration_seconds_count[5m])",
              "legendFormat": "average latency",
              "refId": "A"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          }
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": [
        "firefusion",
        "backend",
        "observability"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timezone": "browser",
      "title": "FireFusion Backend Observability",
      "uid": "firefusion-backend",
      "version": 1
    }
