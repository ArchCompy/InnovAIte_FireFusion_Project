apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: firefusion-platform
data:
  dashboards.yaml: |
    apiVersion: 1

    providers:
      - name: FireFusion
        orgId: 1
        folder: FireFusion
        type: file
        disableDeletion: true
        editable: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards/firefusion
