apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: firefusion-alloy
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/log
      - namespaces
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: firefusion-alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: firefusion-alloy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: monitoring
