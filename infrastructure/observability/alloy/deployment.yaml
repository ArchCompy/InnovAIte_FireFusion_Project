apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: firefusion-platform

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: alloy

  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
        app.kubernetes.io/part-of: firefusion-platform

    spec:
      serviceAccountName: alloy

      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: alloy
          image: grafana/alloy:v1.19.0

          args:
            - run
            - /etc/alloy/config.alloy
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data

          ports:
            - name: http
              containerPort: 12345

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi

          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6

          volumeMounts:
            - name: alloy-config
              mountPath: /etc/alloy
              readOnly: true

            - name: alloy-data
              mountPath: /var/lib/alloy

            - name: alloy-tmp
              mountPath: /tmp

      volumes:
        - name: alloy-config
          configMap:
            name: alloy-config

        - name: alloy-data
          emptyDir: {}

        - name: alloy-tmp
          emptyDir: {}