apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: monitoring
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/part-of: firefusion-platform
spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: tempo

  template:
    metadata:
      labels:
        app.kubernetes.io/name: tempo
        app.kubernetes.io/part-of: firefusion-platform

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: tempo
          image: grafana/tempo:2.6.1

          args:
            - -config.file=/etc/tempo/tempo.yaml

          ports:
            - name: http
              containerPort: 3200

            - name: otlp-grpc
              containerPort: 4317

            - name: otlp-http
              containerPort: 4318

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20

          volumeMounts:
            - name: tempo-config
              mountPath: /etc/tempo
              readOnly: true

            - name: tempo-data
              mountPath: /var/tempo

            - name: tempo-tmp
              mountPath: /tmp

      volumes:
        - name: tempo-config
          configMap:
            name: tempo-config

        - name: tempo-data
          emptyDir: {}

        - name: tempo-tmp
          emptyDir: {}
