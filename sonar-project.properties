# SonarQube analysis for the Backend stream.
# See backend/docs/sonarqube.md for setup, and .github/workflows/sonarqube.yml
# for how it runs. The project key (and organization, for SonarQube Cloud) are
# supplied by the workflow from repository variables, not hard-coded here.

sonar.sourceEncoding=UTF-8

# Scope: only what the Backend stream owns. Frontend, AI Modelling and Data
# Engineering directories are deliberately not scanned, so their code quality
# never gates a Backend PR.
sonar.sources=backend,infrastructure
sonar.tests=backend/tests
sonar.test.inclusions=backend/tests/**/*.py

sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
# Files the unit tests never import are missing from coverage.xml; count them
# as 0% instead of leaving them out, so coverage is not overstated.
sonar.python.coverage.forceZeroCoverage=true

# Main and test files must be disjoint sets, so tests are excluded from sources.
# The rest is material that lives under backend/ but belongs to another stream,
# or is not source at all:
#   - AI Modelling's forecaster source and trained weights, vendored into model-api
#   - AI/sample data and pickled models
#   - Data Engineering's database schema and seed data
sonar.exclusions=\
  backend/tests/**,\
  backend/model-api/src/**,\
  backend/model-api/app/data/**,\
  backend/model-api/app/models/*.pkl,\
  backend/utilities/aggregator-init.sql,\
  backend/utilities/seed-aggregator.sql,\
  backend/utilities/v2/**,\
  backend/.local-db-backups/**,\
  **/__pycache__/**
