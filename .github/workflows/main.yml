name: FireFusion Multi-API CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: Basic API Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FireFusion API dependencies
        run: |
          if [ -f backend/firefusion-api/requirements.txt ]; then
            pip install -r backend/firefusion-api/requirements.txt
          fi

      - name: Install Aggregator API dependencies
        run: |
          if [ -f backend/aggregator-api/requirements.txt ]; then
            pip install -r backend/aggregator-api/requirements.txt
          fi

      - name: Install Model API dependencies
        run: |
          if [ -f backend/model-api/requirements.txt ]; then
            pip install -r backend/model-api/requirements.txt
          fi

  backend-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start the backend stack
        working-directory: backend
        run: docker compose --profile default up --build -d

      - name: Wait for services to be ready
        working-directory: backend
        run: |
          urls="http://localhost:8080/openapi.json http://localhost:8081/model/hello http://localhost:8082/openapi.json"
          for url in $urls; do
            echo "waiting for $url"
            ok=""
            for i in $(seq 1 40); do
              if curl -fsS "$url" >/dev/null 2>&1; then echo "up: $url"; ok=1; break; fi
              sleep 3
            done
            if [ -z "$ok" ]; then echo "timeout waiting for $url"; docker compose --profile default logs; exit 1; fi
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r backend/tests/requirements-test.txt

      - name: Seed a sample prediction so the live-feature checks have data
        working-directory: backend
        run: |
          # Without a cached prediction the endpoint correctly returns an empty
          # FeatureCollection, and the per-feature contract checks have nothing to
          # validate. Seeding a known-good payload makes those checks meaningful.
          python3 - <<'PY' > /tmp/prediction.json
          import json
          print(json.dumps({
              "type": "FeatureCollection",
              "features": [{
                  "type": "Feature",
                  "geometry": {
                      "type": "Polygon",
                      "coordinates": [[
                          [142.1560, -37.5600], [142.3200, -37.7400],
                          [142.5100, -37.6500], [142.3800, -37.5100],
                          [142.1560, -37.5600]
                      ]]
                  },
                  "properties": {"risk_factor": 2, "fire_probability": 0.78}
              }]
          }))
          PY
          docker compose exec -T cache redis-cli -x SET predictions < /tmp/prediction.json
          echo "seeded prediction into the cache"

      - name: Run backend unit tests
        run: pytest backend/tests -m "not integration"

      - name: Run backend integration and contract tests
        run: pytest backend/tests -m integration

      - name: Verify the Fire Risk Map contract tests actually ran
        run: |
          # Integration tests skip when a service is unreachable. A silent skip
          # would let broken integration work merge, so fail the job instead.
          # An empty forecast is a valid contract response, so only an
          # unreachable stack is treated as a failure here.
          pytest backend/tests/test_fire_risk_map_contract.py -q -rs > contract.log 2>&1 || true
          cat contract.log
          if grep -q "not reachable" contract.log; then
            echo "::error::Fire Risk Map contract tests skipped - the backend stack was not reachable."
            exit 1
          fi
          if ! grep -qE "[0-9]+ passed" contract.log; then
            echo "::error::Fire Risk Map contract tests did not pass."
            exit 1
          fi
          if grep -q "no features to validate" contract.log; then
            echo "::warning::The forecast was empty, so the per-feature contract checks did not run."
          fi

      - name: Dump container logs on failure
        if: failure()
        working-directory: backend
        run: docker compose --profile default logs

      - name: Tear down
        if: always()
        working-directory: backend
        run: docker compose --profile default down -v

  docker-build-push:
    name: Build and Push API Images
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push'

    strategy:
      matrix:
        # The build context is backend/ (not each service directory) because
        # every image also COPYs the top-level shared/ package. Each
        # Dockerfile's COPY paths are relative to backend/.
        include:
          - service: firefusion-api
            context: ./backend
            dockerfile: ./backend/firefusion-api/Dockerfile
            image: ghcr.io/${{ github.repository }}/firefusion-api

          - service: aggregator-api
            context: ./backend
            dockerfile: ./backend/aggregator-api/Dockerfile
            image: ghcr.io/${{ github.repository }}/aggregator-api

          # Enable once Dockerfile is added
          # - service: model-api
          #   context: ./backend
          #   dockerfile: ./backend/model-api/Dockerfile
          #   image: ghcr.io/${{ github.repository }}/model-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and Push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}