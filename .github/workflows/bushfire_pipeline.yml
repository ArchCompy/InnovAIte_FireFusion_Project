name: Bushfire At-Risk Daily Pipeline

on:
  workflow_dispatch:

  schedule:
  - cron: "0 20 * * *"

jobs:
  bushfire-pipeline:
    runs-on: ubuntu-latest

    env:
      DB_HOST: ${{ secrets.SUPABASE_HOST }}
      DB_PORT: ${{ secrets.SUPABASE_PORT }}
      DB_NAME: ${{ secrets.SUPABASE_DB }}
      DB_USER: ${{ secrets.SUPABASE_USER }}
      DB_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn geopy python-dotenv psycopg2-binary

      - name: Run Bushfire At-Risk pipeline
        working-directory: data-engineering/pipelines/bushfire_at_risk_register
        run: python run_pipeline.py